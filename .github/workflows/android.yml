# Builds the Android debug APK, including NotchlineCore through the Swift SDK for Android, on
# every push or pull request that touches the core or the Android app. The core's tests need an
# arm64 device, so they run locally with `scripts/android.sh test` rather than here.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "Sources/NotchlineCore/**"
      - "Tests/NotchlineTests/**"
      - "android/**"
      - "scripts/android.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Sources/NotchlineCore/**"
      - "Tests/NotchlineTests/**"
      - "android/**"
      - "scripts/android.sh"
      - ".github/workflows/android.yml"

env:
  # Must match android/swift/.swift-version. The checksum is from the Swift SDK for Android
  # getting started guide on swift.org.
  SWIFT_SDK_URL: https://download.swift.org/swift-6.4.1-release/android-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_android.artifactbundle.tar.gz
  SWIFT_SDK_CHECKSUM: a356b79f8f1daa6ae3a66f4c556966ca20c0208b3659805cf30a83a0a31d6772
  NDK_VERSION: 30.0.16248370

jobs:
  apk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install swiftly and the Swift toolchain
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --no-modify-profile --skip-install --assume-yes
          ~/.swiftly/bin/swiftly install --assume-yes "$(cat android/swift/.swift-version)"

      - name: Install the Swift SDK for Android
        run: ~/.swiftly/bin/swiftly run swift sdk install "$SWIFT_SDK_URL" --checksum "$SWIFT_SDK_CHECKSUM" "+$(cat android/swift/.swift-version)"

      - name: Install NDK r30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Build the debug APK
        run: scripts/android.sh apk

      - uses: actions/upload-artifact@v4
        with:
          name: notchline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
