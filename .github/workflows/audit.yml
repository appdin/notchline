# Scheduled known-vulnerability report. Vendored from the scaffold repo by
# scaffold-sync; edit it there, not here.
#
# This is the one thing a pre-push hook cannot do. A hook plus a solo
# developer is the same coverage as CI, but only for work that a push
# triggers, and a dependency becomes vulnerable while you are not pushing.
# That is the whole reason this runs on a schedule rather than at the gate,
# and the reason it is the only scheduled job here.
#
# Report only. A red run here is the notification; it blocks nothing.
# `make check` and `make deploy` MUST NOT call vulnscan.
#
# This file is vendored into public repos, so it carries no project names,
# hostnames or findings. Keep it that way.
name: audit

on:
  schedule:
    # 06:17 Pacific Monday, in UTC because GitHub only speaks UTC. The odd
    # minute keeps it off the top-of-hour queue where scheduled runs get
    # delayed by tens of minutes.
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned, not `latest`: a scanner that silently changes what it
      # considers a finding turns the weekly signal into noise. The rule
      # against mutable references applies to the tool as much as to an
      # image.
      #
      # Downloaded from the upstream public release rather than wrapped in a
      # reusable action, so a public repo's CI never depends on a private one.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.7.0
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl -fsSL --retry 3 -o /usr/local/bin/osv-scanner "${url}"
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      # The report goes to the run summary rather than an issue or an email
      # body: it is already the page you land on from the failure
      # notification, it keeps full markdown, and it needs no write token.
      #
      # SUMMARY names the file vulnscan writes its image findings to, as
      # JSON, when the repository's audit target passes it on with
      # --summary. A target that scans no image writes a summary with none.
      - name: Scan
        env:
          SUMMARY: ${{ runner.temp }}/audit-summary.json
        run: |
          set -euo pipefail
          make audit FORMAT=markdown SUMMARY="${SUMMARY}" | tee -a "${GITHUB_STEP_SUMMARY}"

      # Each week's image findings are kept in a bucket that belongs to this
      # repository alone, under the scan's UTC date, so a later report can
      # tell when each finding appeared and when it went away. The key can
      # only upload there: it cannot read, list or delete, and the bucket
      # keeps every version of every object, so a week that is overwritten
      # stays recoverable. A repository without the secrets keeps no image
      # history and skips the upload.
      #
      # It runs after a failed scan too, because a scan that found shipped
      # advisories fails the step and has still written its summary.
      - name: Upload image findings
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ runner.temp }}/audit-summary.json
          AUDIT_TIGRIS_BUCKET: ${{ secrets.AUDIT_TIGRIS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AUDIT_TIGRIS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AUDIT_TIGRIS_SECRET }}
          # Tigris answers to the region "auto", and rejects the checksum
          # headers AWS CLI v2 adds to every upload unless told to send them
          # only when an operation requires one.
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_TIGRIS_BUCKET}" ]; then
            echo "No AUDIT_TIGRIS_BUCKET secret, so no image history is kept."
            exit 0
          fi
          # A missing summary has to fail the run. Uploading nothing quietly
          # would show later as a missed week, long after anyone could ask
          # why.
          if [ ! -s "${SUMMARY}" ]; then
            echo "::error::make audit wrote no image summary. Its vulnscan call needs --summary \$(SUMMARY), or the scan stopped before writing one."
            exit 1
          fi
          day="$(jq -r '.scanned_at[0:10]' "${SUMMARY}")"
          if ! [[ "${day}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::the image summary has no usable scanned_at date."
            exit 1
          fi
          aws s3 cp "${SUMMARY}" "s3://${AUDIT_TIGRIS_BUCKET}/${day}.json" \
            --endpoint-url https://fly.storage.tigris.dev \
            --content-type application/json --only-show-errors
          echo "Uploaded this week's image findings as ${day}.json."
